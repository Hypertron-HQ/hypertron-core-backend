# Deploy hypertron-core-backend to AWS App Runner
#
# Manual only — does not run on git push, so Render auto-deploys are unchanged.
# First-time AWS infra must already exist (run ./deploy/aws/deploy.sh locally).
# This workflow only builds the existing Dockerfile and pushes to ECR.
# App Runner auto-deploys when :latest is updated.

name: Deploy AWS App Runner

on:
  workflow_dispatch:
    inputs:
      region:
        description: AWS region of the App Runner stack
        required: true
        default: us-east-1

permissions:
  contents: read

jobs:
  push-image:
    name: Build and push ECR image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
            -t "$ECR_REGISTRY/hypertron-core-backend:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/hypertron-core-backend:latest" \
            .
          docker push "$ECR_REGISTRY/hypertron-core-backend:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/hypertron-core-backend:latest"
